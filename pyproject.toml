[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "igl-cognitive-runtime"
version = "0.1.0"
description = "Deterministic cognitive frame selection for AI agents"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: live integration tests against a running IGL Memory server"]
addopts = "-m 'not live'"
